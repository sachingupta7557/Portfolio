<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #111, #333);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.07);
            padding: 40px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 25px;
            line-height: 1.6;
            color: #ddd;
        }

        a.button {
            display: inline-block;
            padding: 14px 30px;
            background: #00c6ff;
            color: #000;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: 0.25s;
        }

        a.button:hover {
            background: #00a9db;
            transform: translateY(-3px);
        }

        .glow {
            width: 180px;
            height: 180px;
            background: #00c6ff;
            opacity: 0.15;
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            z-index: -1;
        }

        .glow.g1 { top: 10%; left: 15%; }
        .glow.g2 { bottom: 10%; right: 15%; }
    </style>
</head>

<body>
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <div class="container">
        <h1>You're Already was in portfolio page</h1>
        <p>Thanks for clicking the link.Feel free to explore the projects and learn more.</p>
        <a class="button" href="index.html">Go To Portfolio</a>
    </div>
</body>
</html>
